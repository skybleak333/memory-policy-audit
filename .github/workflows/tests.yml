name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Audit on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    env:
      DO_NOT_TRACK: '1'
      HINDSIGHT_API_LLM_PROVIDER: none
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: onnx
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_HOST: 127.0.0.1
      HINDSIGHT_API_PORT: '8888'
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install and verify Relate 1.2.0
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/relatedb/relate/releases/download/v1.2.0/relate-linux-amd64 \
            --output "$RUNNER_TEMP/relate"
          printf '%s  %s\n' 03e05e7cf25eec498e328837a3b6636c7a4807410b989e4b72948f1ebc8a99a5 \
            "$RUNNER_TEMP/relate" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/relate"
          "$RUNNER_TEMP/relate" --version

      - name: Run graph tests and the offline demo
        run: |
          php tests/audit.php "$RUNNER_TEMP/relate"
          php bin/memory-audit demo --relate="$RUNNER_TEMP/relate"

      - uses: actions/setup-python@v6
        if: matrix.php == '8.4'
        with:
          python-version: '3.12'

      - name: Start local Hindsight 1.2.3
        if: matrix.php == '8.4'
        run: |
          python -m pip install --quiet 'hindsight-api-slim[local-onnx,embedded-db]==1.2.3'
          nohup hindsight-api > "$RUNNER_TEMP/hindsight.log" 2>&1 &
          for attempt in $(seq 1 150); do
            if curl -sf http://127.0.0.1:8888/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8888/version

      - name: Run the live Hindsight and Relate scenario
        if: matrix.php == '8.4'
        env:
          HINDSIGHT_URL: http://127.0.0.1:8888
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          php tests/live.php "$RUNNER_TEMP/relate"

      - name: Print the server log on failure
        if: failure() && matrix.php == '8.4'
        run: |
          if test -f "$RUNNER_TEMP/hindsight.log"; then
            tail -n 150 "$RUNNER_TEMP/hindsight.log"
          fi
