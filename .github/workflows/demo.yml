name: Publish browser demo

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'examples/**'
      - 'queries/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm --prefix demo ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix demo run build
      - name: Check the published network in Chrome
        run: npm --prefix demo run test:agent-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public agent discovery
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "${SITE_URL%/}/agents/.well-known/nsdeploy.json?commit=$GITHUB_SHA" \
            | jq -e 'any(.exports[]; .network == "policy_audit")'
